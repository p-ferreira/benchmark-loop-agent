[project]
name = "benchmark-loop-agent"
version = "0.1.0"
description = "Runs single-turn BFCL function-calling cases through OpenAI and Anthropic and scores them with BFCL's own checker."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.12.0",
    "openai>=3.57.0",
    "openinference-instrumentation-anthropic>=3.3.9",
    "openinference-instrumentation-openai>=0.1.77",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

# The τ-bench retail part (benchmark_loop_agent.tau) runs upstream's own code,
# vendored under vendor/tau2_bench, and needs upstream's dependencies and its
# Python (3.12). The BFCL part does not need this group; "uv sync --no-group tau"
# leaves it out and works on any Python from 3.10.
[dependency-groups]
tau = [
    "rich; python_full_version >= '3.12' and python_full_version < '3.13'",
    "tabulate>=0.9.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "fastapi>=0.115.11; python_full_version >= '3.12' and python_full_version < '3.13'",
    "uvicorn>=0.34.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "pandas>=2.2.3; python_full_version >= '3.12' and python_full_version < '3.13'",
    "psutil>=7.0.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "loguru>=0.7.3; python_full_version >= '3.12' and python_full_version < '3.13'",
    "docstring-parser>=0.16; python_full_version >= '3.12' and python_full_version < '3.13'",
    "litellm>=1.80.15,<1.82.7; python_full_version >= '3.12' and python_full_version < '3.13'",
    "tenacity>=9.0.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "deepdiff>=8.4.2; python_full_version >= '3.12' and python_full_version < '3.13'",
    "addict>=2.4.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "PyYAML>=6.0.2; python_full_version >= '3.12' and python_full_version < '3.13'",
    "toml>=0.10.2; python_full_version >= '3.12' and python_full_version < '3.13'",
    "python-dotenv>=1.0.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "typer>=0.12.5; python_full_version >= '3.12' and python_full_version < '3.13'",
    "requests>=2.31.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "numpy>=1.24.0; python_full_version >= '3.12' and python_full_version < '3.13'",
    "httpx>=0.24.0; python_full_version >= '3.12' and python_full_version < '3.13'",
]

[tool.uv]
default-groups = ["tau"]
